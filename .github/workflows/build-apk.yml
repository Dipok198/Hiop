name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Find project folder (gradlew)
        id: find
        run: |
          # Agar project zip ki shakal mein upload hua hai to usse kholo
          for z in ./*.zip; do
            [ -f "$z" ] && unzip -q -o "$z" -d unzipped_project || true
          done
          G=$(find . -maxdepth 4 -name gradlew -not -path './.git/*' | head -n 1)
          if [ -z "$G" ]; then
            echo "::error::gradlew nahi mili. Repo mein poora project upload karo (app/, gradle/, gradlew, settings.gradle.kts ...)."
            ls -R . | head -50
            exit 1
          fi
          D=$(dirname "$G")
          echo "Project dir: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          chmod +x "$G"

      # Debug APK: always built, installs directly on a phone.
      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: ./gradlew :app:assembleDebug --stacktrace

      # Optional signed release APK: only if KEYSTORE_BASE64 + KEYSTORE_PASSWORD secrets exist.
      - name: Build signed release APK
        working-directory: ${{ steps.find.outputs.dir }}
        if: env.HAS_KEYSTORE == 'true'
        env:
          SHILEX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SHILEX_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APKs
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/MISTY-debug.apk
          if [ -d app/build/outputs/apk/release ]; then
            cp app/build/outputs/apk/release/*.apk dist/MISTY-release.apk || true
          fi
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MISTY-apk
          path: ${{ steps.find.outputs.dir }}/dist/*.apk

      # Direct-download APK on the Releases page (easy from a phone).
      - name: Publish to Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MISTY build ${{ github.run_number }}
          files: ${{ steps.find.outputs.dir }}/dist/*.apk
